name: Skills CLI

# Advisory only. Release acceptance uses the local gate (distribution/release-gate.mjs), never this workflow.
# No hosted Mac runners: macOS is covered by running the local gate on a self-hosted Mac.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/skills-cli/package-lock.json
      - run: npm ci
        working-directory: packages/skills-cli
      - run: npm test
        working-directory: packages/skills-cli
      - run: npm run smoke
        working-directory: packages/skills-cli

  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-skills.py
      - run: python3 tests/test-manifest.py
      - run: python3 tests/test-freshness.py
      - run: python3 -m unittest discover -s tests -p 'test_grill_artifact_contract.py'
      - run: python3 -m unittest discover -s tests -p 'test_agent_cli_contract.py'
      - run: node --test tests/pwa-helpers.test.mjs
