<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Starter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231c1c1b'/%3E%3C/svg%3E" />
    <script>
      // Set the theme before first paint so the window never flashes the wrong colour.
      // The desktop shell names the theme it painted the window with in the address
      // (#theme=dark), read from its own saved window state, which a kill cannot lose;
      // a plain browser falls back to localStorage, then to the system's setting.
      (function () {
        var theme = null;
        var named = /(?:^#|&)theme=(light|dark)(?:&|$)/.exec(location.hash);
        if (named) theme = named[1];
        else try { theme = localStorage.getItem('app.theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
