# Headless sway for the container checks: one output, no Xwayland, every
# window floating so it keeps the size the app asked for.
xwayland disable
output HEADLESS-1 resolution 1600x1000 position 0,0 bg #336699 solid_color
default_border normal 2
for_window [app_id=".*"] floating enable
for_window [title=".*"] floating enable
